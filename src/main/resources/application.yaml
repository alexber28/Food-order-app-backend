server:
  port: 8080

spring:
  application:
    name: restaurant-app
  datasource:
    url: jdbc:postgresql://localhost:5432/restaurant_db
    username: postgres
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        "[format_sql]": true